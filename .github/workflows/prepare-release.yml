name: Prepare Release

on:
    workflow_dispatch:
        inputs:
            increment:
                description: 'Version increment type'
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major

jobs:
    prepare:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Bump package version
              id: bump-version
              run: |
                  npm version ${{ inputs.increment }} --no-git-tag-version --ignore-scripts
                  echo "version=$(npm pkg get version | tr -d '"')" >> "$GITHUB_OUTPUT"

            - name: Update manifest.json and versions.json
              run: node version-bump.mjs
              env:
                  npm_package_version: ${{ steps.bump-version.outputs.version }}

            - name: Bump changelog [${{ inputs.increment }}]
              id: update-changelog
              uses: release-flow/keep-a-changelog-action@v3
              with:
                  command: bump
                  version: ${{ inputs.increment }}
                  keep-unreleased-section: true

            - name: Create release bump pull request
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.WORKFLOW_PAT }}
                  commit-message: "chore(release): bump version to ${{ steps.bump-version.outputs.version }}"
                  branch: "chore/release-${{ steps.bump-version.outputs.version }}"
                  delete-branch: true
                  title: "chore(release): bump version to ${{ steps.bump-version.outputs.version }}"
                  body: |
                      Automated version bump generated by workflow_dispatch.

                      Increment: ${{ inputs.increment }}
                      Version: ${{ steps.bump-version.outputs.version }}
                  add-paths: |
                      package.json
                      package-lock.json
                      manifest.json
                      versions.json
                      CHANGELOG.md
